# TCN Trading System Configuration
# Layer 0: Core hyperparameters and experiment settings

# Experiment tracking
experiment:
  name: "tcn_baseline_v1"
  seed: 42
  device: "cpu"  # or "cuda"

# Data configuration
data:
  frequency: "daily"  # Options: "1m", "5m", "1h", "daily"
  symbol: "SPY"  # Primary ticker to trade
  
  # Data splits (YYYY-MM-DD format)
  train_start: "2010-01-01"
  train_end: "2018-01-01"
  
  val_start: "2018-01-01"
  val_end: "2019-01-01"
  
  test_start: "2019-01-01"
  test_end: "2021-01-01"
  
  # Feature engineering
  seq_len: 64  # Lookback window
  n_features: 56  # Number of engineered features per bar (12 basic + 44 advanced)
  use_advanced_features: true  # Use advanced feature set
  use_alternative_labels: true  # Use multi-day labels instead of next-bar
  
  # Label definition
  label_type: "multiday_return"  # Options: "binary_direction", "multiday_return", "regime", "volatility"
  label_threshold: 0.005  # For threshold-based labels
  label_horizon: 5  # Days ahead to predict (for multiday labels)

# Feature configuration
features:
  # Feature list (must match n_features)
  feature_names:
    - "bar_return"           # log or pct return
    - "rolling_volatility"   # std of returns
    - "hl_range"            # (high - low) / close
    - "intrabar_position"   # (close - low) / (high - low)
    - "sma_fast"            # fast SMA
    - "sma_slow"            # slow SMA
    - "sma_ratio"           # fast/slow ratio
    - "log_volume"          # log(volume)
    - "volume_ratio"        # volume vs rolling avg
    - "time_of_day"         # hour encoding (for intraday)
    - "day_of_week"         # weekday encoding
    - "prev_return"         # lag-1 return
  
  # Feature hyperparameters
  vol_window: 20          # Rolling window for volatility
  sma_fast_period: 5      # Fast SMA period
  sma_slow_period: 20     # Slow SMA period
  volume_window: 20       # Rolling window for volume avg
  
  # Normalization
  normalization: "zscore"  # Options: "zscore", "minmax", "robust"
  rolling_norm: false      # Use rolling normalization (for live trading)

# Model architecture
model:
  name: "causal_tcn"
  
  # TCN architecture
  num_inputs: 56          # Must match n_features (updated for advanced features)
  num_channels: [64, 64, 128]  # Channel size per TCN block (larger for more features)
  kernel_size: 3          # Convolution kernel size
  dropout: 0.15           # Dropout rate (increased for more features)
  
  # Output
  output_dim: 1           # Binary classification
  
  # Computed fields (don't edit)
  num_blocks: 3           # len(num_channels)
  dilations: [1, 2, 4]    # 2^i for i in range(num_blocks)

# Training configuration
training:
  # Optimization
  optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  
  # Loss
  loss: "bce_with_logits"  # Options: "bce_with_logits", "bce"
  
  # Training loop
  batch_size: 64
  num_epochs: 20
  early_stopping_patience: 5
  
  # Learning rate schedule
  use_scheduler: true
  scheduler_type: "reduce_on_plateau"  # Options: "reduce_on_plateau", "cosine"
  scheduler_patience: 3
  scheduler_factor: 0.5
  
  # Validation
  val_frequency: 1  # Validate every N epochs
  
  # Checkpointing
  save_best_only: true
  checkpoint_metric: "val_auc"  # Metric to monitor

# Risk map configuration
risk_map:
  # Dead band
  deadband: 0.02  # Minimum edge to trade (|p - 0.5| must exceed this)
  
  # Volatility scaling
  vol_target: 0.01  # Target volatility (adjust based on frequency)
  vol_scale_min: 0.2  # Min scaling factor
  vol_scale_max: 1.5  # Max scaling factor
  
  # Position limits
  base_leverage: 1.0
  max_abs_position: 1.0  # Maximum absolute position size
  
  # Volatility estimation
  vol_window: 20  # Rolling window for vol estimation
  vol_method: "std"  # Options: "std", "ewma", "garch"

# Backtest configuration
backtest:
  # Initial conditions
  initial_capital: 100000.0
  
  # Transaction costs
  commission_bps: 1.0  # Commission in basis points per side
  slippage_bps: 0.5    # Slippage in basis points
  
  # Execution
  execution_delay: 1  # Bars between signal and execution
  
  # Risk controls
  max_turnover_per_day: null  # Optional turnover cap
  
  # Metrics to track
  metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "max_drawdown"
    - "win_rate"
    - "profit_factor"
    - "avg_turnover"

# Visualization configuration
visualization:
  # Plot styles
  style: "seaborn-v0_8-darkgrid"
  figsize: [12, 6]
  dpi: 100
  
  # Diagnostics to generate
  layer1_diagnostics:
    - "feature_timeseries"
    - "feature_distributions"
    - "correlation_matrix"
    - "label_balance"
    - "missing_data"
  
  layer3_diagnostics:
    - "loss_curves"
    - "accuracy_curves"
    - "calibration_plot"
    - "prediction_distribution"
  
  layer6_diagnostics:
    - "equity_curve"
    - "drawdown"
    - "position_over_time"
    - "returns_distribution"
    - "turnover"

# Paths
paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  model_dir: "models/checkpoints"
  results_dir: "results"
  figures_dir: "results/figures"

